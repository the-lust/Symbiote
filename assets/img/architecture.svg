<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <style>
      .box { fill: #f0f4f8; stroke: #7a8a9e; stroke-width: 1.5; rx: 6; ry: 6; }
      .sub-box { fill: #e6edf5; stroke: #8a9bb0; stroke-width: 1; rx: 5; ry: 5; }
      .highlight { fill: #dce9fa; stroke: #4a7bc4; stroke-width: 1.5; rx: 6; ry: 6; }
      .sub-hl { fill: #edf3fc; stroke: #6a9be0; stroke-width: 1; rx: 5; ry: 5; }
      .label { fill: #222; font-size: 13px; font-weight: 600; }
      .sub-label { fill: #333; font-size: 11px; }
      .desc { fill: #555; font-size: 10px; }
      .hl-label { fill: #1a3a6a; font-size: 13px; font-weight: 600; }
      .line { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .line-note { fill: #888; font-size: 10px; font-style: italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#222">Architecture</text>

  <!-- launcher.exe -->
  <rect x="30" y="40" width="160" height="36" class="box"/>
  <text x="110" y="58" text-anchor="middle" class="label">launcher.exe</text>
  <text x="110" y="70" text-anchor="middle" class="desc">CLI — injects engine.dll</text>

  <!-- Arrow: launcher → target -->
  <line x1="190" y1="58" x2="250" y2="58" class="line"/>

  <!-- Target process box -->
  <rect x="260" y="30" width="300" height="210" class="highlight"/>
  <text x="410" y="50" text-anchor="middle" class="hl-label">Target process — ring 3</text>

  <!-- proxy DLLs inside target -->
  <rect x="280" y="65" width="260" height="80" class="sub-hl"/>
  <text x="410" y="85" text-anchor="middle" class="sub-label">13 Proxy DLLs</text>
  <text x="410" y="100" text-anchor="middle" class="desc">ntdll · kernel32 · kernelbase · advapi32</text>
  <text x="410" y="114" text-anchor="middle" class="desc">user32 · wbem · wtsapi32 · secur32 · crypt32</text>
  <text x="410" y="128" text-anchor="middle" class="desc">winhttp · dnsapi · iphlpapi · ws2_32</text>

  <!-- engine.dll inside target -->
  <rect x="280" y="155" width="260" height="36" class="sub-hl"/>
  <text x="410" y="173" text-anchor="middle" class="sub-label">engine.dll</text>
  <text x="410" y="186" text-anchor="middle" class="desc">WHP partition · EPT · exit dispatch</text>

  <!-- Arrow: proxy → engine -->
  <line x1="410" y1="145" x2="410" y2="155" class="line"/>

  <!-- Arrow: target → WHP partition -->
  <line x1="560" y1="98" x2="620" y2="98" class="line"/>
  <line x1="620" y1="98" x2="620" y2="120" class="line"/>
  <line x1="560" y1="173" x2="620" y2="173" class="line"/>
  <line x1="620" y1="173" x2="620" y2="120" class="line"/>

  <!-- WHP Partition -->
  <rect x="420" y="270" width="240" height="210" class="highlight"/>
  <text x="540" y="292" text-anchor="middle" class="hl-label">WHP Partition</text>

  <!-- Exit dispatcher -->
  <rect x="440" y="305" width="200" height="50" class="sub-hl"/>
  <text x="540" y="323" text-anchor="middle" class="sub-label">Exit Dispatcher</text>
  <text x="540" y="338" text-anchor="middle" class="desc">CpuidHandler · MsrHandler · RdtscHandler</text>
  <text x="540" y="350" text-anchor="middle" class="desc">EPT Hooks · ExceptionHandler</text>

  <!-- Arrow: dispatcher → MinimalKernel -->
  <line x1="540" y1="355" x2="540" y2="375" class="line"/>

  <!-- MinimalKernel -->
  <rect x="440" y="375" width="200" height="50" class="sub-hl"/>
  <text x="540" y="392" text-anchor="middle" class="sub-label">MinimalKernel</text>
  <text x="540" y="407" text-anchor="middle" class="desc">Syscall dispatch to 17 emulators</text>
  <text x="540" y="418" text-anchor="middle" class="desc">Process · Memory · File · Registry · HwId · ...</text>

  <!-- Arrow: MinimalKernel → Real Windows kernel -->
  <line x1="540" y1="425" x2="540" y2="450" class="line"/>

  <!-- Real Windows -->
  <rect x="440" y="450" width="200" height="24" class="sub-box"/>
  <text x="540" y="466" text-anchor="middle" class="sub-label">Real Windows kernel + GPU driver (fallthrough)</text>

  <!-- Side: Sandboxie-style isolation modules -->
  <rect x="680" y="270" width="200" height="120" class="sub-box"/>
  <text x="780" y="290" text-anchor="middle" class="sub-label">Sandboxie-style Isolation</text>
  <text x="780" y="306" text-anchor="middle" class="desc">FileRedirection (COW + merge)</text>
  <text x="780" y="320" text-anchor="middle" class="desc">RegistryRedirection (COW + delete)</text>
  <text x="780" y="334" text-anchor="middle" class="desc">IpcFilter (ALPC/pipe block)</text>
  <text x="780" y="348" text-anchor="middle" class="desc">VirtualDisk (VHDX-backed)</text>
  <text x="780" y="362" text-anchor="middle" class="desc">SandboxFallthrough (coordinator)</text>

  <line x1="660" y1="330" x2="680" y2="330" class="line"/>

  <!-- Side: Profile reader -->
  <rect x="680" y="40" width="200" height="80" class="sub-box"/>
  <text x="780" y="58" text-anchor="middle" class="sub-label">Config Profile</text>
  <text x="780" y="74" text-anchor="middle" class="desc">CPUID leaves · MSR ranges</text>
  <text x="780" y="88" text-anchor="middle" class="desc">TSC frequency · HWIDs</text>
  <text x="780" y="102" text-anchor="middle" class="desc">Registry answers · firmware tables</text>

  <line x1="560" y1="65" x2="680" y2="65" class="line"/>

  <!-- Side: GDB stub -->
  <rect x="680" y="130" width="200" height="36" class="sub-box"/>
  <text x="780" y="148" text-anchor="middle" class="sub-label">GDB Stub (TCP :1234)</text>

  <line x1="560" y1="148" x2="680" y2="148" class="line"/>
</svg>