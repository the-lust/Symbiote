; =============================================================================
; Symbiote Config — EXAMPLE PROFILE (generic desktop, Intel i9-10900K)
; =============================================================================
; Copy this to config.ini and edit values for your own target/host. All
; status=1 / enabled=true fields mean spoofing is active; status=0 passes the
; real value through, which is useful for debugging one section at a time.
;
; config.ini itself is gitignored on purpose — it typically ends up holding
; real hardware identifiers (disk serials, MAC addresses, system UUID) that
; you don't want committed. Keep those in config.ini locally; this file
; should stay generic.
; =============================================================================

