; --- KUSER_SHARED_DATA spoofing --------------------------------------------
[kuser]
status = 1
; --- identity (donor) fields ---
build_number = 19045
nt_major_version = 10
nt_minor_version = 0
product_type = 1
product_type_is_valid = 1
native_processor_architecture = 9
suite_mask = 0x0110
number_of_physical_pages = 8388574
active_processor_count = 20
active_group_count = 2
; --- time fields (offsets in 100ns units applied to the spoofed clock) ---
; tick_count no longer exists: TickCountQuad is derived from the virtual clock
; (an interrupt-rate counter cannot be a static identity value — it must tick)
system_time_offset = 10000000
interrupt_time_offset = 5000000
utc_bias = -300
; shared_data_flags: real systems show 0x010E; leave 0 (zero-rule) unless the
; donor machine provides a live dump (see processor_features below)
shared_data_flags = 0
; optional 64-byte hex dump captured from the donor machine; absent = zeros
; (config.ini carries the live donor blob; see the key comment there)
; processor_features = <128 hex chars = 64 bytes from a real dump>

