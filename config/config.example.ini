; --- Virtual machine (WHP partition) --------------------------------------
[vm]
memory_size_mb = 16384
cpu_count = 2

; --- Hypervisor hiding -----------------------------------------------------
;   alloc_tracker = true   -> enable ntdll inline hook detection via AllocTracker
;                             (off by default, detectable by integrity checks)
;   system_spoofer = true  -> enable VEH-based system information spoofing
[hypervisor_hiding]
alloc_tracker = false
system_spoofer = false

[system_spoofer]
enabled = false

; --- Threaded integrity watchdog ------------------------------------------
[watchdog]
enabled = true

; --- EPT split-view (process cloaking) --------------------------------------
[ept_split_view]
enabled = true
; 2MB large pages are used for contiguous ranges automatically; no config
; needed beyond enabled=true.

; --- ACPI PM timer / HPET spoofing ------------------------------------------
[acpi_timer]
enabled = true
; Synthetic ACPI PM timer (port 0x608, 3.579545 MHz, 24-bit) plus HPET MMIO
; counters, kept consistent with the spoofed TSC frequency above.

; --- CounterUpdater (synthetic TSC thread) ----------------------------------
[counter_updater]
enabled = true
; Background thread advances a synthetic TSC at the configured frequency so
; RDTSC returns that instead of real-TSC-plus-offset, masking VM-exit
; overhead entirely since the counter runs continuously.
tsc_frequency = 3700000000

; --- Anti-memory-scanning (INT3 patch camouflage) ---------------------------
[anti_scan]
enabled = true
; Replaces INT3 patches with multi-byte NOP camouflage when not actively
; triggered, so anti-tamper memory CRC scans don't see them.

; --- Thread hiding -----------------------------------------------------
[thread_hider]
enabled = true
; Hides engine threads from CreateToolhelp32Snapshot/Thread32First/Next and
; NtQuerySystemInformation(SystemProcessInformation) enumeration.

; --- Storage HWID spoofing --------------------------------------------------
[hwid_spoofing]
enabled = true
; Intercepts storage IOCTLs and volume info queries; values come from
; [storage] and [hardware] above.

[memory_guard]
enabled = true
; Tracks PAGE_GUARD via NtProtectVirtualMemory, blocks cross-process
; reads/writes on guarded pages at syscall dispatch level.

[device_io]
enabled = true
; Hooks NtDeviceIoControlFile to intercept WHP IOCTL calls
; (GetPartitionProperty, SetPartitionProperty, RunVirtualProcessor, etc.)
; and returns spoofed values for detected queries.

; --- Export Address Table patching -----------------------------------------
[eat]
enabled = true

; --- Syscall forwarding ------------------------------------------------
[forwarding]
enabled = true
host_syscall_thunk = true

; --- CPU backend selection -------------------------------------------------
; type = whp      → Windows Hypervisor Platform (default, requires WHP support)
; type = unicorn  → Unicorn Engine emulation (requires unicorn.dll at runtime)
[backend]
type = whp

; --- Target application ------------------------------------------------
[target]
path = C:\Path\to\target.exe
arguments =
wait_for_debugger = false

; --- BYOVD (Bring Your Own Vulnerable Driver) ---------------------------
; Universal auto-detect: Intel GPU, ASUS GLCKIo, Razer, MSI WinRing0,
; AORUS, EVGA, GMER, or admin PhysicalMemory fallback.
[byovd]
enabled = false
; Driver capabilities are auto-detected — no config needed

; --- Kernel proxy (SSDT hooks, EPROCESS sanitizer, LSTAR/IDT monitors) ---
[kernel_proxy]
enabled = false
hook_ssdt = true
hook_eprocess = true
hook_lstar = true
hook_idt = true
hook_driver_list = true

; --- Rename (random proxy DLL naming per run) ---------------------------
; Each run, all 15 proxy DLLs get random 8-hex-digit names.
; The rename table is baked into ConfigSnapshot at launcher setup.
[rename]
enabled = true

; --- QEMU Tier B (firmware table generation library) --------------------
; Always-on — links QEMU's ACPI/SMBIOS table generators into engine.dll
; to spoof firmware tables for the WHP guest.
[qemu_tier_b]
enabled = true
cpu_count = 0        ; 0 = auto from [vm]
pcie_ec_base = 0xE0000000
pm_timer_port = 0x408

; --- QEMU Tier A (full Windows guest via WHPX) --------------------------
; Optional — requires a Windows Lite VHDX (see scripts/build_minimal_win.ps1)
; Full Windows guest runs inside WHP partition for maximum isolation.
[qemu_tier_a]
enabled = false
vhdx_path = D:\emu\winlite\winlite.vhdx
cpu_count = 2
memory_mb = 2048

; --- Syscall interception -------------------------------------------
; M0 finding: WHP has NO per-syscall exit bitmap (fabricated in an earlier
; version; the API never existed). All syscalls trap via LSTAR->HLT and are
; dispatched by the engine; selective interception is available through EPT
; execute-access hooks on the 0F 05 stub region. This section is retained as
; documentation of the audit result.
[syscall_bitmap]
enabled = true

; ---------------- Stealth (always-on by default) ----------------
; always_on=1: every spoof vector is ENABLED unless its own section
; explicitly sets status=0. always_on=0: full passthrough (debug mode).
[stealth]
always_on = 1

; ---------------- Hypervisor rail ----------------
; mode=whp    : PRIMARY rail — WHP user-mode hypervisor (default, preferred)
; mode=driver : OPTIONAL advanced ring -1 rail (AMD: SimpleSVM-style,
;               Intel: HyperDbg-style). NOT BUILT YET — engine fails loud.
[hypervisor]
enabled = 1
mode = whp

; ---------------- External tool integration ----------------
; All paths optional. Used by launcher --list-tools / --tool / --unpack / --analyze.
; Steam/SteamStub unpack chain (research use on binaries you own):
;   steamless = C:\tools\Steamless.exe
;   gbe = C:\tools\gbe.exe
;   opensteamtools = C:\tools\OpenSteamTools.exe
;   steamsls = C:\tools\steamsls.exe
;   steamvent = C:\tools\steamvent.exe
;   steamdira = C:\tools\steamdira.exe
; Debuggers / analyzers / tracers:
;   ce = C:\Program Files\Cheat Engine\cheatengine-x86_64.exe
;   ghidra = C:\ghidra\support\analyzeHeadless.bat
;   x64dbg = C:\x64dbg\x64dbg.exe
;   binja = C:\BinaryNinja\binaryninja.exe
;   ida = C:\IDA\ida.exe
;   pin = C:\pin\pin.exe
; AI analyzer (local model CLI; %REPORT% is replaced with report.json path):
;   ai_analyzer = python tools\ai_analyze.py --llm "ollama run llama3.2"
;   (fallback: launcher tries python tools\ai_analyze.py <report> itself)
[tools]
steamless =
gbe =
opensteamtools =
steamsls =
steamvent =
steamdira =
ce =
ghidra =
x64dbg =
binja =
ida =
pin =
ai_analyzer =
unpack_dir = dump\unpacked
